<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        {{define "content"}}
        <table>
            {{range .}}
                <tr>
                    <td>{{.Amount}}</td>
                    <td>{{.Description}}</td>
                </tr>
            {{end}}
        </table>
    </main>
    <form method="POST" action="/add">
        <input name="amount">
        <input name="description">
        <input name="date">
        <button>submit</button>
        {{end}}
    </form>
</body>
</html>
